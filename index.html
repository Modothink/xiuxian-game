<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信</title>
<style>
/* ===== WeChat PC 基础配色 ===== */
:root {
  --sidebar: #2e2e2e;
  --sidebar-hover: #3a3a3a;
  --sidebar-active: #3e3e3e;
  --chat-bg: #f0f0f0;
  --chat-white: #ffffff;
  --topbar: #ededed;
  --bubble-self: #95ec69;
  --bubble-other: #ffffff;
  --text-primary: #111111;
  --text-secondary: #888888;
  --text-link: #576b95;
  --border: #e7e7e7;
  --brand: #07c160;
  --red-dot: #fa5151;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%; margin: 0; padding: 0;
  background: var(--chat-bg);
  font-family: var(--font);
}

/* ===== 主外壳：全屏微信PC窗口 ===== */
#app {
  width: 100%; height: 100vh;
  display: flex; flex-direction: column;
  background: var(--chat-bg);
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}

/* 标题栏 */
#titlebar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 16px; background: var(--topbar);
  border-bottom: 1px solid var(--border); min-height: 36px;
  font-size: 13px; color: var(--text-primary); cursor: default;
}
#titlebar .tb-left { display: flex; align-items: center; gap: 8px; }
#titlebar .tb-avatar {
  width: 20px; height: 20px; border-radius: 2px;
  background: var(--brand); display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px;
}
#titlebar .tb-name { font-weight: 500; cursor: pointer; }
#titlebar .tb-name:hover { color: var(--brand); }
#titlebar .tb-ctrl { font-size: 16px; color: #999; cursor: pointer; }

/* 主内容区 */
#main {
  display: flex; flex: 1; overflow: hidden; min-height: 0;
}

/* 左侧联系人列表 */
#sidebar {
  width: 200px; min-width: 160px; background: var(--sidebar);
  display: flex; flex-direction: column;
  font-size: 13px; color: #ccc;
}
#sidebar .sb-search {
  padding: 10px 12px;
}
#sidebar .sb-search input {
  width: 100%; padding: 4px 8px; border-radius: 3px; border: none;
  background: #3a3a3a; color: #ccc; font-size: 12px; outline: none;
}
#sidebar .sb-search input::placeholder { color: #777; }

#sidebar .sb-contact {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.1s;
}
#sidebar .sb-contact:hover { background: var(--sidebar-hover); }
#sidebar .sb-contact.active {
  background: var(--sidebar-active);
  border-left-color: var(--brand);
}
#sidebar .sb-contact .sc-avatar {
  width: 32px; height: 32px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
#sidebar .sb-contact .sc-info { flex: 1; min-width: 0; }
#sidebar .sb-contact .sc-name { font-size: 13px; color: #ddd; }
#sidebar .sb-contact .sc-preview { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sidebar .sb-contact .sc-badge {
  font-size: 10px; background: var(--red-dot); color: #fff;
  padding: 1px 5px; border-radius: 8px; min-width: 16px; text-align: center;
}
#sidebar .sb-footer {
  margin-top: auto; padding: 8px 14px;
  font-size: 11px; color: #aaa;
  border-top: 1px solid #3a3a3a;
  display: flex; flex-direction: column; gap: 2px;
}

/* 右侧聊天区 */
#chat-area {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}

/* 消息列表 */
#messages {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 2px; }

/* 消息气泡 */
.msg { display: flex; flex-direction: column; margin-bottom: 2px; }
.msg-system {
  align-items: center; text-align: center;
  padding: 4px 0; font-size: 12px; color: #b0b0b0;
}
.msg-from { align-items: flex-start; }
.msg-to { align-items: flex-end; }

.msg .bubble {
  max-width: 75%; padding: 8px 12px; border-radius: 4px;
  font-size: 14px; line-height: 1.55; word-break: break-word;
  position: relative;
}
.msg-from .bubble { background: var(--bubble-other); color: var(--text-primary); }
.msg-to .bubble { background: var(--bubble-self); color: var(--text-primary); }

.msg .bubble .bubble-title {
  font-size: 12px; color: var(--text-link); margin-bottom: 2px;
}
.msg .bubble .bubble-body { }
.msg .bubble .bubble-highlight { color: #07c160; font-weight: bold; }
.msg .bubble .bubble-dim { color: #999; font-size: 13px; }

/* 消息中的操作按钮 */
.bubble .bubble-actions {
  display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap;
}
.bubble .bubble-btn {
  padding: 4px 10px; border-radius: 3px; border: 1px solid #ddd;
  background: #fff; font-size: 12px; cursor: pointer;
  color: var(--text-primary);
  font-family: var(--font);
  transition: all 0.15s;
}
.bubble .bubble-btn:hover { background: #f5f5f5; border-color: var(--brand); color: var(--brand); }
.bubble .bubble-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.bubble .bubble-btn.accent {
  background: #07c160; color: #fff; border-color: #07c160;
}
.bubble .bubble-btn.accent:hover { background: #06ad56; }
.bubble .bubble-btn.danger { color: #fa5151; border-color: #fa5151; }

/* 离线收益卡片 */
.bubble-card {
  background: #f8f8f8 !important; border: 1px solid #e7e7e7;
  padding: 10px 12px !important;
}
.bubble-card .card-title {
  font-size: 13px; font-weight: 500; margin-bottom: 4px;
  color: var(--text-primary);
}
.bubble-card .card-row {
  font-size: 12px; color: #666; padding: 1px 0;
}
.bubble-card .card-val { color: var(--brand); font-weight: bold; }

/* 输入区 */
#input-area {
  padding: 8px 16px 12px; border-top: 1px solid var(--border);
  background: #fafafa;
}
#input-area .input-tools {
  display: flex; gap: 12px; padding: 4px 0; font-size: 18px;
  color: #999; cursor: default;
}
#input-area .input-box-wrap {
  display: flex; gap: 8px; align-items: flex-end;
}
#input-area textarea {
  flex: 1; padding: 6px 10px; border: 1px solid #e0e0e0;
  border-radius: 3px; font: 13px var(--font); resize: none;
  outline: none; height: 36px; max-height: 72px;
  background: #fff; color: var(--text-primary);
}
#input-area textarea:focus { border-color: var(--brand); }
#input-area .send-btn {
  padding: 6px 16px; background: #e0e0e0; border: none;
  border-radius: 3px; font: 13px var(--font); cursor: pointer;
  color: #999;
}
#input-area .send-btn.active { background: var(--brand); color: #fff; cursor: pointer; }
#input-area .action-bar {
  display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap;
}
#input-area .action-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 10px;
  background: #e8e8e8; color: #666; cursor: pointer;
  border: none; font-family: var(--font);
  transition: all 0.15s;
}
#input-area .action-chip:hover { background: #d0f0d8; color: var(--brand); }
#input-area .action-chip:disabled { opacity: 0.3; cursor: not-allowed; }

/* 离线弹窗 */
#modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 100;
  justify-content: center; align-items: center;
}
#modal-overlay.show { display: flex; }
#modal {
  background: #fff; border-radius: 6px; width: 320px;
  overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}
#modal .modal-title {
  padding: 16px 20px 8px; font-size: 15px; font-weight: 500;
  text-align: center; background: #fff;
}
#modal .modal-body { padding: 8px 20px 16px; text-align: center; font-size: 14px; color: #666; }
#modal .modal-body .val { color: var(--brand); font-size: 22px; font-weight: bold; display: block; margin: 6px 0; }
#modal .modal-close {
  width: 100%; padding: 10px; border: none; border-top: 1px solid var(--border);
  background: #fff; color: var(--text-link); font-size: 14px;
  cursor: pointer; font-family: var(--font);
}
#modal .modal-close:hover { background: #f5f5f5; }

/* 响应式 */
@media (max-width: 600px) {
  #app { max-height: 100vh; border-radius: 0; }
  #sidebar { width: 70px; min-width: 70px; }
  #sidebar .sb-contact .sc-info { display: none; }
  #sidebar .sb-contact { justify-content: center; padding: 12px 0; }
  #sidebar .sb-search { display: none; }
}

/* ===== 突破进度条（独立横幅） ===== */
.bt-progress {
  display: none; align-items: center; position: relative;
  height: 22px; width: 100%;
  background: #f5f5f5; overflow: hidden;
  border-bottom: 1px solid #e7e7e7;
  cursor: default;
}
.bt-progress.visible { display: flex; }
.bt-progress.ready {
  cursor: pointer;
  animation: btPulse 1.5s ease-in-out infinite;
}
@keyframes btPulse {
  0%, 100% { box-shadow: inset 0 0 0 0 rgba(7,193,96,0.3); }
  50% { box-shadow: inset 0 0 12px 2px rgba(7,193,96,0.15); }
}
.bt-progress .bt-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, #a8e6cf, #07c160);
  transition: width 0.5s ease;
}
.bt-progress.ready .bt-fill {
  background: linear-gradient(90deg, #07c160, #00d46a);
}
.bt-progress .bt-text {
  position: relative; z-index: 1;
  font-size: 12px; font-weight: 600; color: #333;
  padding: 0 12px; white-space: nowrap; width: 100%;
}
.bt-progress.ready .bt-text { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

/* ===== 节奏突破渡劫条 ===== */
#rhythm-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3); z-index: 200;
  justify-content: center; align-items: center;
}
#rhythm-overlay.active { display: flex; }
#rhythm-box {
  background: #fff; border-radius: 8px; padding: 24px 28px;
  text-align: center; min-width: 320px; max-width: 400px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
}
#rhythm-box h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; color: #333; }
#rhythm-box .rhythm-hint { font-size: 12px; color: #999; margin-bottom: 16px; }
#rhythm-bar {
  width: 100%; height: 8px; background: #e8e8e8; border-radius: 4px;
  position: relative; overflow: hidden; margin: 8px 0;
}
#rhythm-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: #07c160; position: absolute; top: -2px;
  transition: none;
}
#rhythm-zone-r {
  position: absolute; top: 0; height: 100%;
  background: rgba(250,81,81,0.35);
  left: 0; right: 60%;
}
#rhythm-zone-y {
  position: absolute; top: 0; height: 100%;
  background: rgba(250,200,50,0.30);
  left: 20%; right: 40%;
}
#rhythm-zone-g {
  position: absolute; top: 0; height: 100%;
  background: rgba(7,193,96,0.25);
  left: 40%; right: 40%;
}
.sb-btn {
  background: none; border: none; color: #888; cursor: pointer;
  font-size: 13px; padding: 2px 4px; font-family: var(--font);
}
.sb-btn:hover { color: #ccc; }
#rhythm-result {
  font-size: 13px; margin-top: 12px; min-height: 20px;
}
#rhythm-result.success { color: #07c160; }
#rhythm-result.miss { color: #999; }
/* 伪装设置·内联编辑 */
.dce-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;flex-wrap:wrap;}
.dce-inp{border:1px solid #ddd;border-radius:3px;padding:2px 6px;font-size:12px;font-family:var(--font);background:#fff;outline:none;}
.dce-inp:focus{border-color:#07c160;}
.dce-inp-name{width:110px;}
.dce-inp-icon{width:36px;text-align:center;}
.dce-inp-from{width:85px;}
.dce-inp-text{flex:1;min-width:130px;}
.dce-ebtn{border:none;background:none;cursor:pointer;font-size:12px;padding:1px 5px;border-radius:3px;font-family:var(--font);}
.dce-ebtn:hover{background:#e0e0e0;}
.dce-save{color:#07c160;font-weight:bold;}
.dce-cancel{color:#999;}
.dce-act{color:#576b95;}
.dce-del{color:#fa5151;}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.25s;font-family:var(--font);}
.toast.show{opacity:1;}
/* 伪装模式标题栏 */
#tb-search { display:none; width:120px; border:none; background:transparent; font-size:12px; color:#999; outline:none; padding:2px 6px; font-family:var(--font); }
#tb-search.show { display:block; }
/* 聊天区头部（伪装模式） */
#chat-header { display:none; padding:10px 16px; background:#f5f5f5; border-bottom:1px solid #e0e0e0; font-size:14px; font-weight:500; align-items:center; gap:8px; }
#chat-header.show { display:flex; }
</style>
</head>

<div id="app">
  <!-- 标题栏 -->
  <div id="titlebar">
    <div class="tb-left">
      <div class="tb-avatar" id="tb-avatar">修</div>
      <span class="tb-name" id="tb-name" title="点击或按Esc切换">修仙系统</span>
      <input class="tb-search" id="tb-search" type="text" placeholder="搜索" disabled>
    </div>
    <span class="tb-ctrl" id="tb-ctrl">—</span>
  </div>

  <!-- 主内容 -->
  <div id="main">
    <!-- 左侧联系人 -->
    <div id="sidebar">
      <div class="sb-search">
        <input type="text" placeholder="搜索" disabled>
      </div>
      <div id="contact-list">
        <!-- JS动态生成 -->
      </div>
      <div class="sb-footer">
        <span id="ft-online">—</span>
        <span id="ft-ver">修炼日志 v1.0</span>
        <button class="sb-btn" id="btn-save" title="导出存档">💾</button>
        <button class="sb-btn" id="btn-load" title="导入存档">📥</button>
        <button class="sb-btn" id="btn-newgame" title="新游戏（清空存档）">🔄</button>
      </div>
    </div>

    <!-- 聊天区 -->
    <div id="chat-area">
      <div id="chat-header"></div>
      <div id="messages"></div>
      <div id="input-area">
        <div id="bt-progress" class="bt-progress"></div>
        <div class="input-box-wrap">
          <textarea id="chat-input" placeholder="修炼：运转周天" rows="1"></textarea>
          <button class="send-btn" id="send-btn">发送</button>
        </div>
        <div class="action-bar" id="action-bar">
          <!-- JS动态生成 -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 离线弹窗 -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-title">🏔️ 闭关归来</div>
    <div class="modal-body" id="modal-body"></div>
    <button class="modal-close" id="modal-close">继续修炼</button>
  </div>
</div>

<!-- 渡劫节奏条 -->
<div id="rhythm-overlay">
  <div id="rhythm-box">
    <h3>⚡ 天劫降临</h3>
    <div class="rhythm-hint">按空格键在绿色区域截断灵气…</div>
    <div id="rhythm-bar">
      <div id="rhythm-zone-r"></div>
      <div id="rhythm-zone-y"></div>
      <div id="rhythm-zone-g"></div>
      <div id="rhythm-dot"></div>
    </div>
    <div id="rhythm-result"></div>
  </div>
</div>
